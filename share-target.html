<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f4a28" />
  <title>导入到知识库</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Serif SC', 'PingFang SC', serif;
      background: #faf5ec;
      color: #2b2622;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(43,38,34,0.08);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #8a7e6f; margin-bottom: 20px; line-height: 1.6; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #e8dfd0;
      border-top-color: #2f4a28;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { font-size: 13px; color: #5a5048; line-height: 1.6; }
    .result .ok { color: #2f4a28; font-weight: 600; }
    .result .err { color: #c44; }
    .preview {
      text-align: left;
      background: #f7f3eb;
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0;
      font-size: 12px;
      color: #5a5048;
      line-height: 1.5;
    }
    .preview .label { color: #8a7e6f; font-size: 11px; margin-bottom: 2px; }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 24px;
      background: #2f4a28;
      color: #faf5ec;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">📥</div>
    <div class="title" id="title">正在导入...</div>
    <div class="sub" id="sub">提取内容并智能分类中</div>
    <div id="spinner" class="spinner"></div>
    <div id="result" class="result"></div>
    <div id="preview"></div>
    <a id="openBtn" class="btn" href="./index.html#knowledge" style="display:none;">查看知识库</a>
  </div>

  <script>
    /* ====== 动态加载依赖脚本 ====== */
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function detectSource(url) {
      if (!url) return '未知';
      if (url.includes('xiaohongshu') || url.includes('xhslink')) return '小红书';
      if (url.includes('douyin') || url.includes('iesdouyin')) return '抖音';
      if (url.includes('weibo')) return '微博';
      if (url.includes('mp.weixin')) return '微信公众号';
      if (url.includes('zhihu')) return '知乎';
      if (url.includes('bilibili') || url.includes('b23.tv')) return '哔哩哔哩';
      if (url.includes('kuaishou')) return '快手';
      return '网页';
    }

    function showResult(ok, title, sub) {
      document.getElementById('icon').textContent = ok ? '✅' : '❌';
      document.getElementById('title').textContent = title;
      document.getElementById('sub').textContent = sub;
      document.getElementById('spinner').style.display = 'none';
      if (ok) {
        document.getElementById('openBtn').style.display = 'inline-block';
      }
    }

    async function init() {
      // 加载依赖：db.js → ai.js → kb-skill.js
      await loadScript('./scripts/db.js?v=45');
      await loadScript('./scripts/ai.js?v=45');
      await AI.loadConfig();
      await loadScript('./modules/kb-skill.js?v=45');

      // ====== 读取分享数据 ======
      let shareData = { title: '', text: '', url: '' };

      // 方式1：从 URL 参数读取（SW 重定向时附带）
      const params = new URLSearchParams(window.location.search);
      shareData.title = params.get('title') || '';
      shareData.text = params.get('text') || '';
      shareData.url = params.get('url') || '';

      // 方式2：从 sessionStorage 读取（SW 存入）
      if (!shareData.title && !shareData.text && !shareData.url) {
        try {
          const stored = sessionStorage.getItem('shareData');
          if (stored) {
            shareData = JSON.parse(stored);
            sessionStorage.removeItem('shareData');
          }
        } catch(e) {}
      }

      // 方式3：监听 message（SW postMessage）
      if (!shareData.title && !shareData.text && !shareData.url) {
        shareData = await new Promise((resolve) => {
          const timer = setTimeout(() => resolve({ title: '', text: '', url: '' }), 3000);
          navigator.serviceWorker.addEventListener('message', (e) => {
            clearTimeout(timer);
            if (e.data && e.data.type === 'share-data') {
              resolve(e.data.payload || { title: '', text: '', url: '' });
            }
          });
        });
      }

      if (!shareData.title && !shareData.text && !shareData.url) {
        showResult(false, '未收到分享内容', '请从小红书或其他 App 内使用「分享」功能');
        return;
      }

      // 合并原始内容
      const rawContent = [shareData.title, shareData.text, shareData.url].filter(Boolean).join('\n');

      // 显示预览
      document.getElementById('preview').innerHTML = `
        <div class="preview">
          <div class="label">原始内容</div>
          ${escapeHtml(rawContent.substring(0, 200))}${rawContent.length > 200 ? '...' : ''}
        </div>
      `;

      // ====== 检查 AI 是否就绪 ======
      if (!KbSkill.isReady()) {
        const fallbackTitle = rawContent.substring(0, 30);
        await db.add(db.STORES.knowledge, {
          title: fallbackTitle,
          summary: rawContent,
          keyPoints: '',
          category: '其他',
          tags: [],
          source: detectSource(shareData.url),
          url: shareData.url || '',
          rawContent: rawContent,
          read: false
        });
        showResult(true, `"${fallbackTitle}" 已导入`,
          'AI Key 未配置，请到「设置」配置 API Key 后使用智能识别');
        return;
      }

      // ====== 调用 KbSkill 智能识别 ======
      document.getElementById('sub').textContent = '正在采集信息...';

      let info = null;
      let errorMsg = '';

      try {
        document.getElementById('sub').textContent = 'AI 深度分析中...';
        info = await KbSkill.analyze(rawContent);
      } catch (e) {
        console.warn('KbSkill 分析失败:', e.message);
        const msg = e.message;
        if (msg === 'API_KEY_NOT_CONFIGURED' || msg === 'API_KEY_INVALID') {
          errorMsg = 'AI Key 无效，请到「设置」配置有效的 API Key';
        } else if (msg === 'API_RATE_LIMIT') {
          errorMsg = 'AI 请求过于频繁，请稍后重试';
        } else if (msg === 'NETWORK_ERROR') {
          errorMsg = '网络连接失败，请检查网络';
        } else {
          errorMsg = 'AI 分析失败，可在知识库中编辑';
        }
      }

      if (info) {
        // ====== 存入数据库 ======
        await db.add(db.STORES.knowledge, {
          title: info.title,
          summary: info.summary,
          keyPoints: info.keyPoints,
          category: info.category,
          tags: info.tags,
          source: info.source,
          url: shareData.url || '',
          rawContent: rawContent,
          read: false
        });
        showResult(true, `"${info.title}" 已导入`,
          `分类：${info.category} · 来源：${info.source}`);
      } else {
        // AI 失败时保存原始内容
        const fallbackTitle = rawContent.substring(0, 30);
        await db.add(db.STORES.knowledge, {
          title: fallbackTitle,
          summary: rawContent,
          keyPoints: '',
          category: '其他',
          tags: [],
          source: detectSource(shareData.url),
          url: shareData.url || '',
          rawContent: rawContent,
          read: false
        });
        showResult(true, `"${fallbackTitle}" 已导入`, errorMsg);
      }
    }

    init();
  </script>
</body>
</html>
