  <script>
    // 注册 Service Worker + 强制更新检测
    // 注意：注册 URL 不带版本号，版本号在 sw.js 内部的 CACHE_NAME 中管理
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          // 检测更新
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (nw) {
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  // 新 SW 已下载，发送 SKIP_WAITING 立即激活
                  console.log('[SW] 新版本已下载，立即激活');
                  nw.postMessage({ type: 'SKIP_WAITING' });
                }
                if (nw.state === 'activated') {
                  // 新 SW 已激活，强制刷新页面加载新资源
                  console.log('[SW] 新版本已激活，刷新页面');
                  window.location.reload();
                }
              });
            }
          });

          // 如果有等待中的 SW，立即激活它
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }

          // 页面可见时立即检查更新（不等 5 分钟）
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update();
          });

          // 每 30 秒检查一次更新（更积极）
          setInterval(() => reg.update(), 30 * 1000);

          // 页面加载时立即检查一次更新
          reg.update();
        }).catch(err => console.error('[SW] 注册失败:', err));

        // 接收 SW 消息
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'FORCE_RELOAD') {
            window.location.reload();
          }
        });
      });
    }
  </script>
